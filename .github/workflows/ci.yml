name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  static:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build with the pinned Rust image
        run: ./build.sh

      - name: Verify the release binary
        run: sha256sum -c SHA256SUMS

      - name: Write checksum
        run: sha256sum dist/xone-relay > dist/xone-relay.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: xone-relay-x86_64-linux-musl
          path: |
            dist/xone-relay
            dist/xone-relay.sha256

      - name: Attach binary to a tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xone-relay
            dist/xone-relay.sha256
